[pytest]
minversion = 8.0
qt_api = pyqt5
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --timeout=20
markers =
    integration: end-to-end UI + real MQTT worker + local broker tests (run with -m integration)
filterwarnings =
    # Matplotlib 3.10.x currently triggers pyparsing deprecation warnings internally
    # (camelCase API aliases in pyparsing). These are third-party warnings, not project issues.
    ignore:.*deprecated - use.*:pyparsing.exceptions.PyparsingDeprecationWarning:matplotlib\._fontconfig_pattern
    ignore:.*deprecated - use.*:pyparsing.exceptions.PyparsingDeprecationWarning:matplotlib\._mathtext
